[project]
name = "blog-builder"
version = "0.1.0"
description = "Static blog build script"
requires-python = ">=3.13"

dependencies = [
    "aiofiles==25.1.0",
    "bs4==0.0.2",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.7",
    "click==8.4.2",
    "feedgen==1.0.0",
    "idna==3.18",
    "Jinja2==3.1.6",
    "Markdown==3.10.2",
    "MarkupSafe==3.0.3",
    "neocitizen>=1.0.0",
    "pytest>=9.0.3",
    "requests==2.34.2",
    "toolz==1.1.0",
    "urllib3==2.7.0",
    "validators==0.35.0",
]

[project.scripts]
build-blog = "build_blog:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_utils.py",
    "test_files.py",
    "test_operations.py",
    "test_rss.py",
    "test_validations.py",
    "test_transformations.py"
]
